[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-rag-skill"
version = "0.1.0"
description = "Local serverless lightweight RAG with knowledge base CRUD and file CRUD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lancedb>=0.12.0",
  "httpx>=0.27.0,<1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = [
  "sentence-transformers>=3.0.0,<6",
  "FlagEmbedding>=1.3.5,<2",
  "transformers>=4.44.2,<5",
]

[project.scripts]
lite-rag = "lite_rag.cli:main"
lite-rag-api = "lite_rag.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
