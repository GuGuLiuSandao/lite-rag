name: lite-rag

services:
  api:
    build:
      context: .
      args:
        INSTALL_LOCAL_MODELS: ${LITE_RAG_INSTALL_LOCAL_MODELS:-true}
    image: lite-rag-api:local
    command: ["python", "-m", "uvicorn", "lite_rag.api:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LITE_RAG_STORAGE_ROOT: /data
      HF_HOME: /models
      OMP_NUM_THREADS: ${LITE_RAG_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${LITE_RAG_CPU_THREADS:-4}
    volumes:
      - type: bind
        source: ${LITE_RAG_DATA_DIR:-./.lite-rag}
        target: /data
      - ${LITE_RAG_MODEL_CACHE:-lite-rag-models}:/models
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
    image: lite-rag-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${LITE_RAG_WEB_PORT:-8080}:80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  lite-rag-models:
